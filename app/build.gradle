plugins { id 'com.android.application' }

android {
    namespace 'com.example.dex2oat'
    compileSdk 36
    defaultConfig {
        applicationId 'com.example.dex2oat'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '1.6.10'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "androidx.work:work-runtime:2.10.5"
 implementation "androidx.recyclerview:recyclerview:1.4.0" }
